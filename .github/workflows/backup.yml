# Respaldo nocturno cifrado de la base, fuera de Supabase. Se guarda 30 días como artefacto de este repo (privado).
# Secretos en GitHub (Settings → Secrets and variables → Actions):
#   BACKUP_DB_URL      cadena "Session pooler" de Supabase (Connect → Session pooler) con la contraseña de la base
#   BACKUP_PASSPHRASE  frase secreta para cifrar; guárdala aparte: sin ella el respaldo no se puede abrir
# Restaurar en un proyecto nuevo de Supabase:
#   gpg -d pancho-AAAA-MM-DD.sql.gz.gpg | gunzip | psql "<cadena de la base>"
#   y luego correr supabase/pegar_todo.sql (recrea el aviso de las 9 pm) y activar los teléfonos con
#   select device_code_bootstrap('Caja 1');   — teléfonos, pases y avisos no van en el respaldo.
name: backup
on:
  schedule: [{ cron: '0 9 * * *' }]   # 3:00 am hora de Ciudad de México
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: Revisar secretos
        env: { DB: '${{ secrets.BACKUP_DB_URL }}', PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          [ -n "$DB" ] || { echo "::error::Falta el secreto BACKUP_DB_URL"; exit 1; }
          [ ${#PASS} -ge 12 ] || { echo "::error::Falta BACKUP_PASSPHRASE o tiene menos de 12 caracteres"; exit 1; }
      - name: Instalar cliente de Postgres 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-17
      - name: Respaldar y cifrar
        env: { DB: '${{ secrets.BACKUP_DB_URL }}', PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          set -o pipefail
          f="pancho-$(date -u +%F).sql.gz.gpg"
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public \
            --exclude-table-data='public.(devices|admins|shifts|pin_attempts|device_codes|device_code_attempts|push_subscriptions|push_config)' \
            | sed '/^CREATE SCHEMA public;$/d' | gzip \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "$f" 3<<<"$PASS"
          [ -s "$f" ] || { echo "::error::El respaldo salió vacío"; exit 1; }
          echo "FILE=$f" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ env.FILE }}', path: '${{ env.FILE }}', retention-days: 30 }
